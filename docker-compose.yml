services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorlink_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    working_dir: /var/www
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_DATABASE=tutorlink
      - DB_USERNAME=root
      - DB_PASSWORD=root

  db:
    image: mysql:8
    container_name: tutorlink_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tutorlink
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
